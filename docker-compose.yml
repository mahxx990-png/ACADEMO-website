version: '3.8'

services:
  web:
    build: .
    container_name: academo-web
    ports:
      - "5000:5000"
    volumes:
      # Bind mount for development: code changes reflect in container
      - .:/app
      # Anonymous volume for pycache to avoid host pollution
      - /app/__pycache__
    environment:
      - FLASK_APP=app.py
      - FLASK_DEBUG=1
      - SECRET_KEY=academo-secret-key-123
      - DATABASE_URL=sqlite:///instance/academo.db
      - OLLAMA_HOST=http://host.docker.internal:11434
    stdin_open: true
    tty: true
    restart: unless-stopped
    # Health check to ensure the tool is ready
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/home"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  # Define named volumes if persistence outside the bind-mount is desired
  # (Currently we rely on bind-mount ./ for data persistence)
  academo_data:
  academo_uploads:
