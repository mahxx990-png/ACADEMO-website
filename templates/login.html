<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Sign in or register — ACADEMO academic planning.">
    <title>ACADEMO — Sign in</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            DEFAULT: '#312e81',
                            light: '#4338ca',
                            accent: '#818cf8',
                        },
                        accent: {
                            DEFAULT: '#4f46e5',
                            hover: '#4338ca',
                        },
                        premium: {
                            50: '#f8fafc',
                            100: '#f1f5f9',
                            200: '#e2e8f0',
                            300: '#cbd5e1',
                            500: '#64748b',
                            600: '#475569',
                            900: '#0f172a',
                        }
                    },
                    fontFamily: {
                        sans: ['"Plus Jakarta Sans"', '"Inter"', 'system-ui', 'sans-serif'],
                        display: ['"Outfit"', 'sans-serif'],
                    },
                    boxShadow: {
                        'premium': '0 20px 50px -12px rgba(15, 23, 42, 0.12)',
                        'premium-hover': '0 30px 60px -12px rgba(15, 23, 42, 0.18)',
                    },
                    animation: {
                        'float': 'float 6s ease-in-out infinite',
                    },
                    keyframes: {
                        float: {
                            '0%, 100%': { transform: 'translateY(0)' },
                            '50%': { transform: 'translateY(-10px)' },
                        }
                    }
                }
            }
        }
    </script>
    <style type="text/tailwindcss">
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Outfit:wght@500;600;700;800&display=swap');
        @layer utilities {
            .animate-fade-in {
                animation: fadeIn 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            }
            .glass {
                background-color: rgba(255, 255, 255, 0.10);
                backdrop-filter: blur(24px);
                -webkit-backdrop-filter: blur(24px);
                border: 1px solid rgba(255, 255, 255, 0.10);
                box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
            }
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        body {
            background-color: #f8fafc;
            font-feature-settings: "cv02", "cv03", "cv04", "cv11";
        }
    </style>
    <script id="auth-data" type="application/json">
        {{ auth_bootstrap | tojson }}
    </script>
    <script>
        window.__ACADEMO_AUTH__ = JSON.parse(document.getElementById('auth-data').textContent);
    </script>
</head>
<body>
    <div id="root"></div>
    <script type="text/babel" src="{{ url_for('static', filename='js/auth_page.jsx', v='20260415-1') }}"></script>
</body>
</html>
