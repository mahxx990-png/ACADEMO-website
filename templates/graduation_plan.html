<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="ACADEMO Graduation Plan Generator — AI-powered full graduation roadmap for CS students.">
    <title>ACADEMO — Graduation Plan</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React & ReactDOM (Production) -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <!-- Babel for on-the-fly JSX transpilation -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- Tailwind Configuration -->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: '#0f0345',
                        brandHover: '#130456',
                        brandLight: '#1d0b74',
                        accent: '#0350c4',
                        surface: '#f8fbff',
                        surfaceHigh: '#eaf1ff'
                    },
                    fontFamily: {
                        sans: ['Inter', 'system-ui', 'sans-serif'],
                    },
                    transitionTimingFunction: {
                        'spring': 'cubic-bezier(0.175, 0.885, 0.32, 1.275)',
                    }
                }
            }
        }
    </script>

    <!-- Custom Essential CSS -->
    <style type="text/tailwindcss">
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');
        
        @layer utilities {
            .animate-fade-in {
                animation: fadeIn 0.4s cubic-bezier(0.4, 0, 0.2, 1) forwards;
            }
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        body { 
            background-color: #f4f8ff; 
            font-feature-settings: "cv02", "cv03", "cv04", "cv11";
        }
        
        /* Custom Elegant Scrollbar */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { 
            background: #c5d6ff; 
            border-radius: 4px; 
        }
        ::-webkit-scrollbar-thumb:hover { background: #96b2fa; }

        /* General styling for dynamic react content */
        .prose h1, .prose h2, .prose h3 {
            color: #0f0345;
        }
        .prose strong {
            color: #0350c4;
            font-weight: 700;
        }

        /* Unified output styling across all modules */
        .academo-output-card {
            background: #ffffff;
            padding: 2rem;
            border-radius: 1.5rem;
            border: 1px solid #e5e7eb;
            box-shadow: 0 20px 45px rgba(0, 0, 0, 0.07);
        }
        .academo-output-content h1,
        .academo-output-content h2,
        .academo-output-content h3 {
            color: #0f0345;
        }
        .academo-output-content strong {
            color: #0350c4;
            font-weight: 700;
        }
        .academo-output-content table {
            border-collapse: separate;
            border-spacing: 0;
            width: 100%;
            margin: 20px 0;
            border-radius: 12px;
            box-shadow: 0 6px 20px rgba(0,0,0,0.08);
            overflow: hidden;
            background: #fff;
        }
        .academo-output-content th {
            background: #01183d;
            color: #fff;
            padding: 12px;
            font-size: 0.85rem;
        }
        .academo-output-content td {
            background: #eaf1ff;
            padding: 10px 12px;
            border: 1px solid #c5d6ff;
            font-size: 0.9rem;
        }
        .academo-output-content tr:hover td {
            background: #dce8ff;
        }
    </style>
</head>
<body>
    <div id="root"></div>
    
    <script type="text/babel" src="{{ url_for('static', filename='js/auth_header_shared.jsx', v='20260416-1') }}"></script>
    <script type="text/babel" src="{{ url_for('static', filename='js/transcript_input_shared.jsx', v='20260416-1') }}"></script>
    <!-- Load React Code -->
    <script type="text/babel" src="{{ url_for('static', filename='js/graduation_plan.jsx', v='20260416-1') }}"></script>
    <script type="text/babel">
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<window.GraduationPlanApp />);
    </script>
</body>
</html>
